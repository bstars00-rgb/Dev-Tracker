name: Weekly update from SharePoint

# Saturday morning, Korea time. 00:00 UTC = 09:00 KST.
# Pulls the workbook straight from SharePoint, rebuilds the board and pushes only if
# something actually changed. The push then triggers the Pages deploy.
on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Download the workbook from SharePoint
        id: fetch
        env:
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_SHARE_URL: ${{ secrets.SP_SHARE_URL }}
        run: npm run fetch:sharepoint

      - name: Rebuild the board
        run: npm run build

      - name: Sanity check before publishing
        run: |
          count=$(node -e "console.log(require('./data/tracker.json').rows.length)")
          echo "rows parsed: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::The sheet produced 0 rows — not publishing. Check the sheet name, header row and columns."
            exit 1
          fi

      - name: Commit if anything moved
        run: |
          git config user.name "dev-tracker-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No change this week — nothing to publish."
            exit 0
          fi
          git add -A
          git commit -m "Weekly refresh from SharePoint ($(date -u +%Y-%m-%d))"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Weekly Dev Tracker refresh"
            echo ""
            if [ -f data/tracker.json ]; then
              node -e "
                const t = require('./data/tracker.json');
                const c = t.counts;
                console.log('- rows: **' + c.total + '**');
                console.log('- status: ' + Object.entries(c.byStatus).map(([k,v]) => k + ' ' + v).join(' · '));
                console.log('- health: ' + Object.entries(c.byHealth).map(([k,v]) => k + ' ' + v).join(' · '));
              "
            else
              echo "- build did not produce data/tracker.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
