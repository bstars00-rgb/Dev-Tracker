<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OHMY Integration Tracker</title>
    <meta name="description" content="Read-only view of the OHMYHOTEL API integration pipeline." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📡</text></svg>" />
    <link rel="stylesheet" href="styles.css?v=20260822T0609" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">OHMY</span>
        <h1>Integration Tracker</h1>
      </div>
      <div class="meta" id="meta"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" data-tab="dashboard" aria-selected="true" data-i18n="nav.dashboard"></button>
      <button type="button" role="tab" data-tab="list" aria-selected="false" data-i18n="nav.list"></button>
    </nav>

    <main>
      <!-- ============================================================ DASHBOARD -->
      <section id="view-dashboard" role="tabpanel" aria-label="Dashboard">
        <div class="kpis" id="kpis"></div>

        <div class="grid-2">
          <section class="panel">
            <div class="panel-head">
              <div>
                <h2 data-i18n="panel.matrix.title"></h2>
                <p data-i18n="panel.matrix.desc"></p>
              </div>
            </div>
            <div class="matrix" id="matrix"></div>
            <p class="panel-foot" id="matrix-note"></p>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <h2 data-i18n="panel.top.title"></h2>
                <p data-i18n="panel.top.desc"></p>
              </div>
            </div>
            <ol class="toplist" id="top-attention"></ol>
          </section>
        </div>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="panel.actions.title"></h2>
              <p data-i18n="panel.actions.desc"></p>
            </div>
            <div class="scope" id="actions-scope"></div>
          </div>
          <p class="actions-summary" id="actions-summary"></p>
          <div class="actions-wrap">
            <table class="actions">
              <thead>
                <tr>
                  <th scope="col" data-i18n="th.act.partner"></th>
                  <th scope="col" data-i18n="th.act.impact"></th>
                  <th scope="col" data-i18n="th.act.route"></th>
                  <th scope="col" data-i18n="th.act.class"></th>
                  <th scope="col" data-i18n="th.act.stage"></th>
                  <th scope="col" data-i18n="th.act.next"></th>
                  <th scope="col" data-i18n="th.act.watch"></th>
                  <th scope="col" class="num" data-i18n="th.act.days"></th>
                </tr>
              </thead>
              <tbody id="actions-body"></tbody>
            </table>
          </div>
          <p class="panel-foot" data-i18n="phase.ref"></p>
        </section>

        <div class="grid-3">
          <section class="panel">
            <div class="panel-head">
              <div>
                <h2 data-i18n="panel.pic.title"></h2>
                <p data-i18n="panel.pic.desc"></p>
              </div>
            </div>
            <div class="breakdown" id="by-pic"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <h2 data-i18n="panel.category.title"></h2>
                <p data-i18n="panel.category.desc"></p>
              </div>
            </div>
            <div class="breakdown" id="by-category"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <h2 data-i18n="panel.aging.title"></h2>
                <p data-i18n="panel.aging.desc"></p>
              </div>
            </div>
            <div class="breakdown" id="by-aging"></div>
          </section>
        </div>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="cov.title"></h2>
              <p data-i18n="cov.desc"></p>
            </div>
          </div>
          <div class="breakdown" id="by-coverage"></div>
          <ul class="gaps" id="data-gaps" hidden></ul>
        </section>
      </section>

      <!-- ============================================================ LIST -->
      <section id="view-list" role="tabpanel" aria-label="All projects" hidden>
        <nav class="subtabs" id="cat-tabs" role="tablist" aria-label="Category"></nav>

        <div class="toolbar" role="group" aria-label="Filters">
          <input id="search" type="search" autocomplete="off" />
          <select id="f-status"></select>
          <select id="f-pic"></select>
          <select id="f-stage"></select>
          <select id="f-class"></select>
          <select id="f-consistency"></select>
          <select id="f-health"></select>
          <button id="toggle-done" type="button" class="btn toggle" aria-pressed="false"></button>
          <span class="spacer"></span>
          <button id="export" type="button" class="btn" data-i18n="btn.export"></button>
          <button id="reset" type="button" class="btn ghost" data-i18n="btn.reset"></button>
        </div>

        <p class="resultline" id="resultline" aria-live="polite"></p>

        <div class="tablewrap">
          <table id="table">
            <thead>
              <tr>
                <th scope="col" class="num sortable" data-sort="no" data-i18n="th.no"></th>
                <th scope="col" class="sortable" data-sort="project" data-i18n="th.partner"></th>
                <th scope="col" class="sortable" data-sort="category" data-i18n="th.category"></th>
                <th scope="col" class="sortable" data-sort="status" data-i18n="th.status"></th>
                <th scope="col" class="sortable" data-sort="progress" data-i18n="th.progress"></th>
                <th scope="col" class="track-col" data-i18n="th.track"></th>
                <th scope="col" class="c-next" data-i18n="th.next"></th>
                <th scope="col" class="c-owner sortable" data-sort="team" data-i18n="th.owner"></th>
                <th scope="col" class="sortable" data-sort="pic" data-i18n="th.pic"></th>
                <th scope="col" class="sortable" data-sort="devLoad" data-i18n="th.load"></th>
                <th scope="col" class="c-switching sortable" data-sort="switching" data-i18n="th.switching"></th>
                <th scope="col" class="c-target sortable" data-sort="target" data-i18n="th.target"></th>
                <th scope="col" class="sortable" data-sort="lastActivity" data-i18n="th.last"></th>
                <th scope="col" class="num sortable" data-sort="days" data-i18n="th.days"></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <p class="empty" id="empty" hidden data-i18n="list.empty"></p>
        </div>
      </section>

      <footer class="foot">
        <span data-i18n="foot.source"></span>
        <span class="keys" id="foot-keys"></span>
      </footer>
    </main>

    <script src="data/tracker.js?v=20260822T0609"></script>
    <script src="i18n.js?v=20260822T0609"></script>
    <script src="app.js?v=20260822T0609"></script>
  </body>
</html>
